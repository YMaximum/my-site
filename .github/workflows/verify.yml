name: Verify portfolio

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # External fork code must never run on the VPS. GitHub approval settings
    # provide the separate gate for forks that propose changing this workflow.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nyassar-portfolio]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Browser OS dependencies are provisioned in the isolated runner image.
      - run: npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
      # Leave CPU and memory headroom for the VPS automation services.
      - run: npm run test:e2e -- --workers=1
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
